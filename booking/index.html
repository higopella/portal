<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Booking | Higo-Pella</title>
  <style>
    * { box-sizing: border-box; }
    :root { --primary: #4fc3f7; --bg: #f7fbff; --card: #fff; --border: #e1e8ed; --text: #333; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    
    .header { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 16px; font-weight: 600; }
    .nav-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    
    .content { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    h3 { font-size: 15px; margin: 0 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
    
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--text); }
    .tab-btn.active { background: #333; color: #fff; border-color: #333; }
    .cal-container { height: 500px; overflow-x: auto; overflow-y: hidden; border: 1px solid var(--border); -webkit-overflow-scrolling: touch; position: relative; }
    .cal-container iframe { position: absolute; top:0; left:0; width: 100%; min-width: 750px; height: 100%; border: 0; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; margin-bottom: 5px; color: #666; }
    input, select { width: 100%; height: 40px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; background: #fff; outline: none; }
    input[type="date"], input[type="time"], input[type="number"] { -webkit-appearance: none; appearance: none; }
    
    .presets { display: flex; gap: 5px; margin-top: 5px; }
    .preset-btn { flex: 1; padding: 8px; background: #f0f4f8; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; cursor: pointer; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 10px; }
    .btn-blue { background: var(--primary); }
    .btn-red { background: #d93025; }
    .btn:disabled { background: #ccc; }
    .link-text { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: underline; }
    
    .del-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid var(--border); margin-bottom: 8px; border-radius: 4px; font-size: 13px; }
    .del-btn { padding: 6px 12px; background: #fff; color: #d93025; border: 1px solid #d93025; border-radius: 4px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Booking</div>
    <a href="../" class="nav-link">Home</a>
  </div>

  <div class="content">
    <div class="card">
      <h3>Schedule</h3>
      <div class="tabs">
        <button class="tab-btn" id="btn-agenda" onclick="mode('agenda')">リスト</button>
        <button class="tab-btn active" id="btn-week" onclick="mode('week')">週</button>
        <button class="tab-btn" id="btn-month" onclick="mode('month')">月</button>
        <button class="tab-btn" onclick="refresh()">更新</button>
      </div>
      <div class="cal-container" id="cal"></div>
    </div>

    <div class="card" id="page-reserve">
      <h3>新規予約 <span class="link-text" onclick="switchPage('delete')">削除へ</span></h3>
      <div class="form-group"><label>日付</label><input type="date" id="date"></div>
      <div class="form-group"><label>開始時刻 (7:00-21:00)</label><input type="time" id="startTime" min="07:00" max="21:00"></div>
      <div class="form-group"><label>バンド名</label><input type="text" id="bandName"></div>
      <div class="form-group"><label>場所</label>
        <select id="room"><option value="" disabled selected>選択</option><option value="①">部室</option><option value="②">機材庫</option><option value="③">教室</option></select>
      </div>
      <div class="form-group"><label>代表者</label><input type="text" id="repName"></div>
      <div class="form-group"><label>譲ります</label>
        <select id="transferStatus"><option value="" disabled selected>選択</option><option value="いつでも">いつでも</option><option value="前半">前半</option><option value="後半">後半</option></select>
      </div>
      <div class="form-group"><label>時間 (分)</label>
        <input type="number" id="duration">
        <div class="presets">
          <button class="preset-btn" onclick="document.getElementById('duration').value=30">30</button>
          <button class="preset-btn" onclick="document.getElementById('duration').value=60">60</button>
          <button class="preset-btn" onclick="document.getElementById('duration').value=90">90</button>
          <button class="preset-btn" onclick="document.getElementById('duration').value=120">120</button>
        </div>
      </div>
      <button class="btn btn-blue" id="submitBtn" onclick="submitBooking()">予約</button>
    </div>

    <div class="card" id="page-delete" style="display:none;">
      <h3>削除・検索 <span class="link-text" onclick="switchPage('reserve')">予約へ</span></h3>
      <div class="form-group"><label>日付</label><input type="date" id="delDate"></div>
      <div class="form-group"><label>開始時刻</label><input type="time" id="delTime"></div>
      <div class="form-group"><label>バンド名</label><input type="text" id="delBand"></div>
      <button class="btn btn-red" id="searchBtn" onclick="search()">検索</button>
      <div id="delList" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") window.location.href = "../";
    const GAS_API_URL = "YOUR_GAS_API_URL_HERE";
    let curMode = 'week';

    window.onload = refresh;

    function mode(m) {
      curMode = m;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-'+m).classList.add('active');
      refresh();
    }

    function refresh() {
      const ts = new Date().getTime();
      const wkst = new Date().getDay() + 1;
      const src = `src=pellapella.calendar@gmail.com&color=%23D50000&src=a18eeaccc3fb519de5b4b3492df6b26232f7967ab4582a2cd4d314600aa03186@group.calendar.google.com&color=%23039BE5&src=aade55a25aef3abb1ab00c832c44b660df1336a113dc29c6fff776f046df3dd3@group.calendar.google.com&color=%23F6BF26&src=fdb34873e469d812b70c3e1f79978398d9a3c0a793287551c3a77ae84f7ed079@group.calendar.google.com&color=%2333B679`;
      document.getElementById('cal').innerHTML = `<iframe src="https://calendar.google.com/calendar/embed?${src}&ctz=Asia%2FTokyo&mode=${curMode}&wkst=${wkst}&showTitle=0&showPrint=0&showTabs=0&t=${ts}"></iframe>`;
    }

    function switchPage(p) {
      document.getElementById('page-reserve').style.display = p==='reserve' ? 'block' : 'none';
      document.getElementById('page-delete').style.display = p==='delete' ? 'block' : 'none';
    }

    async function submitBooking() {
      const d = {
        date: document.getElementById('date').value, startTime: document.getElementById('startTime').value,
        bandName: document.getElementById('bandName').value, room: document.getElementById('room').value,
        repName: document.getElementById('repName').value, transferStatus: document.getElementById('transferStatus').value,
        duration: document.getElementById('duration').value
      };
      if(!d.date || !d.startTime || !d.bandName || !d.room || !d.repName || !d.duration) { alert("入力不足"); return; }
      
      document.getElementById('submitBtn').disabled = true;
      try {
        const res = await fetch(GAS_API_URL, { method:"POST", body: JSON.stringify({action:"addEventToCalendar", data:d}) });
        const json = await res.json();
        if(json.success) { alert("完了"); refresh(); } else { alert(json.error); }
      } catch(e) { alert("エラー"); }
      document.getElementById('submitBtn').disabled = false;
    }

    async function search() {
      const d = { date: document.getElementById('delDate').value, startTime: document.getElementById('delTime').value, bandName: document.getElementById('delBand').value };
      if(!d.date && !d.startTime && !d.bandName) { alert("条件不足"); return; }
      
      document.getElementById('searchBtn').disabled = true;
      try {
        const res = await fetch(GAS_API_URL, { method:"POST", body: JSON.stringify({action:"findEvents", data:d}) });
        const json = await res.json();
        const div = document.getElementById('delList'); div.innerHTML = "";
        if(json.success) {
          json.events.forEach(ev => {
            div.innerHTML += `<div class="del-item"><div>${ev.startStr}<br><b>${ev.title}</b> [${ev.duration}分]</div><button class="del-btn" onclick="execDel('${ev.id}')">削除</button></div>`;
          });
        } else { div.innerHTML = json.error; }
      } catch(e) { alert("エラー"); }
      document.getElementById('searchBtn').disabled = false;
    }

    async function execDel(id) {
      if(!confirm("削除しますか？")) return;
      try {
        const res = await fetch(GAS_API_URL, { method:"POST", body: JSON.stringify({action:"deleteEventById", data:{eventId: id}}) });
        const json = await res.json();
        if(json.success) { alert("削除完了"); search(); refresh(); } else { alert(json.error); }
      } catch(e) { alert("エラー"); }
    }
  </script>
</body>
</html>
