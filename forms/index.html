<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forms | Higo-Pella</title>
  <style>
    * { box-sizing: border-box; }
    :root { --primary: #4fc3f7; --bg: #f7fbff; --card: #fff; --border: #e1e8ed; --text: #333; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    
    .header { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 16px; font-weight: 600; }
    .nav-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    
    .content { max-width: 800px; margin: 20px auto; padding: 0 15px; height: calc(100vh - 80px); }
    iframe { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Forms</div>
    <a href="../" class="nav-link">Home</a>
  </div>

  <div class="content">
    <iframe src="https://docs.google.com/forms/d/1tJ5X0MenvsarbqCQoNNERSf8Srv1p4Ul4Xfl5qvlXqA/viewform?embedded=true"></iframe>
  </div>

  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") window.location.href = "../";
  </script>
</body>
</html>
