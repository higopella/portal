<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幹部 - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../../src/css/common.css">
  <link rel="stylesheet" href="../../src/css/admin.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-role-key="kanbu" data-required-role="kanbu">

  <!-- 0. 権限確認中 -->
  <div id="admin-checking-section" class="container">
    <div class="card admin-login-card">
      <h2 class="admin-login-title">権限確認中</h2>
      <p class="admin-login-description">権限を確認しています…</p>
    </div>
  </div>

  <!-- 1. 権限なし表示 -->
  <div id="admin-access-denied-section" class="container is-hidden">
    <div class="card admin-login-card">
      <h2 class="admin-login-title">権限がありません</h2>
      <p class="admin-login-description">このページは幹部のみアクセスできます。</p>
      <a href="../../" class="btn btn-primary full-width">ホームへ戻る</a>
    </div>
  </div>

  <!-- 2. 幹部ダッシュボード -->
  <main id="admin-dashboard-section" class="container is-hidden">
    <nav id="role-switcher" class="role-switcher is-hidden" aria-label="権限切替"></nav>

    <nav class="admin-tabs" aria-label="管理メニュー">
      <button type="button" class="admin-tab active" data-tab="notice">お知らせ追加</button>
      <button type="button" class="admin-tab" data-tab="booking">予約</button>
      <button type="button" class="admin-tab" data-tab="rooms">練習場所</button>
      <button type="button" class="admin-tab" data-tab="logs">予約ログ</button>
      <button type="button" class="admin-tab" data-tab="users">ユーザー管理</button>
      <button type="button" class="admin-tab" data-tab="access">閲覧数</button>
    </nav>

    <div class="admin-tab-panel" id="tab-notice">

    <!-- お知らせ管理 -->
    <section class="card">
      <div class="card-title">お知らせの追加・管理</div>
      <form id="form-add-notice" class="notice-form">
        <textarea id="notice-text" class="textarea" rows="3" placeholder="お知らせ内容を入力（文字を選択して下のボタンで装飾できます）" required></textarea>
        <div class="notice-toolbar">
          <button type="button" class="btn btn-primary highlight-button" id="btn-insert-highlight">強調(水色)</button>
          <button type="button" class="btn btn-primary highlight-button" id="btn-insert-strike">斜線</button>
        </div>
        <div class="notice-form-row">
          <label class="pin-label">
            <input type="checkbox" id="notice-is-pinned"> 最上部に固定する
          </label>
          <div class="notice-submit-group">
            <button type="button" id="btn-cancel-edit" class="btn small-action-button is-hidden">キャンセル</button>
            <button type="submit" id="btn-submit-notice" class="btn btn-primary">追加</button>
          </div>
        </div>
      </form>

      <div class="card-title notice-list-heading">投稿済み一覧</div>
      <div id="admin-notice-list">読み込み中...</div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-booking">

    <!-- メインカレンダー登録 -->
    <section class="card">
      <div class="card-title">メインカレンダー登録</div>
      <form id="form-main-event" class="notice-form">
        <div class="admin-form-group">
          <label class="admin-form-label" for="main-event-date">日付</label>
          <div class="main-event-grid">
            <input type="date" id="main-event-date" class="input-text" required>
            <label class="pin-label main-event-all-day-label">
              <input type="checkbox" id="main-event-all-day"> 終日
            </label>
          </div>
        </div>
        <div id="main-event-time-row">
          <div class="admin-form-group main-event-grid">
            <div class="admin-form-field">
              <label class="admin-form-label" for="main-event-start">開始時間</label>
              <input type="time" id="main-event-start" class="input-text" step="60">
            </div>
            <div class="admin-form-field">
              <label class="admin-form-label" for="main-event-end">終了時間</label>
              <input type="time" id="main-event-end" class="input-text" step="60">
            </div>
          </div>
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label" for="main-event-title">内容</label>
          <input type="text" id="main-event-title" class="input-text" placeholder="例: 部会" required>
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label" for="main-event-rep-name">予約者名（任意）</label>
          <input type="text" id="main-event-rep-name" class="input-text" placeholder="例: 肥後">
        </div>
        <div class="notice-form-row">
          <span></span>
          <button type="submit" id="btn-submit-main-event" class="btn btn-primary">登録</button>
        </div>
      </form>
    </section>

    <!-- 予約の削除 -->
    <section class="card">
      <div class="card-title">予約の削除（部室①②③・メイン）</div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="admin-delete-date">対象日</label>
        <div class="main-event-grid">
          <input type="date" id="admin-delete-date" class="input-text">
          <button type="button" id="btn-admin-search-events" class="btn btn-primary">検索</button>
        </div>
      </div>
      <div id="admin-event-list" class="table-message">日付を選択して検索してください</div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-rooms">

    <!-- 練習場所の有効化 -->
    <section class="card">
      <div class="card-title">練習場所の有効化</div>
      <p class="admin-login-description">予約フォームで選択できる練習場所を設定します。無効にした場所は予約できなくなります。</p>
      <div id="kanbu-room-list">読み込み中...</div>
      <div class="notice-form-row">
        <span></span>
        <button type="button" id="btn-save-rooms" class="btn btn-primary">保存</button>
      </div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-logs">

    <!-- 操作ログ（直近1ヶ月） -->
    <section class="card">
      <div class="card-title">予約・操作ログ (直近1ヶ月)</div>
      <div class="table-responsive log-scroll">
        <table class="log-table">
          <thead>
            <tr>
              <th>操作日時</th>
              <th>種別</th>
              <th>練習日</th>
              <th>開始</th>
              <th>内容</th>
              <th>分数</th>
              <th>譲り</th>
              <th>操作者</th>
            </tr>
          </thead>
          <tbody id="log-table-body">
            <tr><td colspan="8" class="table-message">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-users">

    <!-- ユーザー管理 -->
    <section class="card">
      <div class="card-title">ユーザー管理（ロール設定）</div>
      <div id="kanbu-user-list">読み込み中...</div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-access">
    <!-- 概要・アクセス数 -->
    <section class="card dashboard-summary">
      <div>
        <span class="access-label">累計アクセス数</span>
        <div id="stat-access-count" class="access-count">--</div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-refresh-all">更新</button>
    </section>
    </div>
  </main>

  <script src="../../src/js/ui.js"></script>
  <script src="../../src/js/notice-cache.js"></script>
  <script src="../../src/js/api.js"></script>
  <script src="../../src/js/auth.js"></script>
  <script src="../../src/js/menu.js"></script>
  <script src="../../src/js/tour.js"></script>
  <script src="../../src/js/role-page.js"></script>
</body>
</html>
