<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/live.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="container">
    <form id="form-live-application">
      <!-- 基本情報 -->
      <section class="card">
        <div class="card-title">Higopelive!! 申請（基本情報）</div>
        <div class="live-form-group">
          <label class="live-label" for="live-select">対象ライブ</label>
          <select id="live-select" class="live-input" required></select>
        </div>
        <div class="live-form-group">
          <label class="live-label" for="live-group-name">グループ名</label>
          <input type="text" id="live-group-name" class="live-input" maxlength="100" placeholder="例: バンドA" required>
        </div>
        <div class="live-form-group">
          <label class="live-label" for="live-representative">代表者</label>
          <input type="text" id="live-representative" class="live-input" maxlength="200" placeholder="例: 肥後" required>
        </div>
        <div class="live-form-group">
          <label class="live-label">演奏曲</label>
          <div id="song-title-list"></div>
          <button type="button" id="btn-add-song" class="btn btn-primary small-action-button">曲を追加</button>
        </div>
      </section>

      <!-- PA表 -->
      <section class="card">
        <div class="card-title">PA表</div>
        <p class="live-note">演者は左から下手→上手の順に詰めて記入してください。使わない列は空欄のままで構いません。</p>
        <div id="pa-member-list"></div>
        <div class="live-form-group live-field-gap">
          <label class="live-label" for="pa-mic-bring">マイク持ち込み（ある場合は"パート/マイク名"を記入）</label>
          <textarea id="pa-mic-bring" class="live-textarea" rows="2" maxlength="1000"></textarea>
        </div>
        <div class="live-form-group">
          <label class="live-label" for="pa-notes">PA 要望・特記欄</label>
          <textarea id="pa-notes" class="live-textarea" rows="3" maxlength="2000"></textarea>
        </div>
        <div id="pa-song-notes"></div>
      </section>

      <!-- 照明表 -->
      <section class="card">
        <div class="card-title">照明表</div>
        <!--p class="live-note">曲のテンポ・イメージカラー・ジャンル・演奏前のMC・要望を入力してください（曲名は基本情報の演奏曲と連動します）。</p>-->
        <p class="live-note">曲の情報を入力してください。</p>

        <!--div class="live-form-group">
          <label class="live-label" for="light-mc-se">MC中SE</label>
          <select id="light-mc-se" class="live-input">
            <option value="" selected disabled>MC中SEを選択</option>
            <option value="true">あり</option>
            <option value="false">なし</option>
          </select>
        </div-->
        <div class="live-form-group">
          <label class="live-label" for="light-notes">照明 要望・特記欄</label>
          <textarea id="light-notes" class="live-textarea" rows="3" maxlength="2000"></textarea>
        </div>
        <div id="light-song-detail-list"></div>
      </section>

      <button type="submit" id="btn-submit-live-application" class="btn btn-primary full-width">申請する</button>
    </form>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/tour.js"></script>
  <script src="../src/js/live.js"></script>
</body>
</html>
