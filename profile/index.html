<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー情報の変更 - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="../src/icon.png">
  <link rel="apple-touch-icon" href="../src/icon.png">
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/signup.css">
  <link rel="stylesheet" href="../src/css/profile.css">
  <script id="google-identity-script" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="signup-container">
    <section class="card signup-card">
      <div class="signup-brand">
        <h1>ユーザー情報の変更</h1>
      </div>

      <form id="profile-form">
        <p class="signup-description">変更する項目を入力して保存してください</p>
        <label class="signup-label" for="profile-full-name">氏名</label>
        <input type="text" id="profile-full-name" class="signup-input" autocomplete="name" maxlength="50" required>
        <label class="signup-label" for="profile-furigana">ふりがな</label>
        <input type="text" id="profile-furigana" class="signup-input" maxlength="50" required>
        <label class="signup-label" for="profile-nickname">ニックネーム</label>
        <input type="text" id="profile-nickname" class="signup-input" autocomplete="nickname" maxlength="10" required>
        <label class="signup-label" for="profile-phone">電話番号</label>
        <input type="tel" id="profile-phone" class="signup-input" autocomplete="tel" inputmode="tel" maxlength="15" placeholder="例: 090-1234-5678" required>
        <label class="signup-label" for="profile-student-id">学籍番号</label>
        <input type="text" id="profile-student-id" class="signup-input" maxlength="20" required>
        <label class="signup-label" for="profile-generation">期（自分の所属期）</label>
        <input type="number" id="profile-generation" class="signup-input" inputmode="numeric" min="1" max="99" step="1" placeholder="例: 25" required>
        <label class="signup-label" for="profile-faculty">学部</label>
        <select id="profile-faculty" class="signup-input signup-select" required>
          <option value="" disabled>選択してください</option>
          <optgroup label="学部">
            <option value="文学部">文学部</option>
            <option value="教育学部">教育学部</option>
            <option value="法学部">法学部</option>
            <option value="理学部">理学部</option>
            <option value="医学部">医学部</option>
            <option value="薬学部">薬学部</option>
            <option value="工学部">工学部</option>
            <option value="情報融合学環">情報融合学環</option>
            <option value="共創学環">共創学環</option>
            <option value="その他">その他</option>
          </optgroup>
          <optgroup label="大学院">
            <option value="教育学研究科">教育学研究科</option>
            <option value="人文社会科学研究部">人文社会科学研究部</option>
            <option value="社会文化科学教育部">社会文化科学教育部</option>
            <option value="先端科学研究部">先端科学研究部</option>
            <option value="自然科学教育部">自然科学教育部</option>
            <option value="生命科学研究部">生命科学研究部</option>
            <option value="医学教育部">医学教育部</option>
            <option value="保健学教育部">保健学教育部</option>
            <option value="薬学教育部">薬学教育部</option>
            <option value="法曹養成研究科">法曹養成研究科</option>
            <option value="特別支援教育特別専攻科">特別支援教育特別専攻科</option>
            <option value="養護教諭特別別科">養護教諭特別別科</option>
          </optgroup>
        </select>
        <label class="signup-label" for="profile-department">学科</label>
        <input type="text" id="profile-department" class="signup-input" maxlength="50" required>
        <label class="signup-label" for="profile-favorite-artist">好きなアーティスト / ジャンル<span class="signup-optional">（任意）</span></label>
        <input type="text" id="profile-favorite-artist" class="signup-input" maxlength="100">
        <button type="submit" id="btn-save-profile" class="btn btn-primary signup-submit">保存</button>
      </form>

      <section class="profile-email-section">
        <h2 class="profile-section-title">学校メールアドレスの変更</h2>
        <p class="profile-current-email">現在: <span id="profile-current-email">取得中...</span></p>
        <label class="signup-label" for="profile-new-email">新しい学校メールアドレス</label>
        <input type="email" id="profile-new-email" class="signup-input" autocomplete="email" placeholder="xxxx@st.kumamoto-u.ac.jp">
        <button type="button" id="btn-send-email-otp" class="btn btn-primary signup-submit">確認コードを送信</button>
        <form id="profile-email-otp-form" class="is-hidden profile-email-otp-form">
          <p class="signup-description">新しいメールアドレスに届いた6桁の確認コードを入力してください</p>
          <label class="signup-label" for="profile-email-otp">確認コード</label>
          <input type="text" id="profile-email-otp" class="signup-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
          <button type="submit" id="btn-verify-email-otp" class="btn btn-primary signup-submit">メールアドレスを変更</button>
        </form>
      </section>
    </section>
  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/tour.js"></script>
  <script src="../src/js/profile.js"></script>
</body>
</html>
