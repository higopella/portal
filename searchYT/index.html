<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube 検索</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f4f6f9; padding: 15px; margin: 0; color: #333; }
    
    /* PC対応：全体を中央に寄せ、最大幅を制限 */
    .app-container { max-width: 800px; margin: 0 auto; }
    
    .nav-bar { background-color: #d32f2f; color: white; padding: 12px; font-weight: bold; display: flex; justify-content: space-between; border-radius: 8px; margin-bottom: 15px; align-items: center; }
    .nav-link { color: white; text-decoration: none; font-size: 14px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; width: 100%; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    label { font-size: 12px; font-weight: bold; }
    .btn-refresh { background-color: #f4f6f9; border: 1px solid #ccc; border-radius: 4px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer; color: #333; }
    
    select, input { width: 100%; height: 38px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    
    .tab-container { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 8px; background: #e9ecef; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; color: #555; }
    .tab-btn.active { background: #d32f2f; color: white; border-color: #d32f2f; }
    
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .video-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: inherit; display: block; }
    .video-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #ddd; }
    .video-info { padding: 8px; }
    .video-title { font-size: 12px; font-weight: bold; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-date { font-size: 10px; color: #777; margin: 0; }
    #loading { text-align: center; color: #d32f2f; font-weight: bold; padding: 20px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="nav-bar">
      <span>▶️ YouTube 検索</span>
      <a href="../" class="nav-link">🏠 ホームへ戻る</a>
    </div>

    <div class="card">
      <div class="form-group">
        <div class="header-row">
          <label>📁 検索対象プレイリスト</label>
          <button class="btn-refresh" onclick="forceRefresh()" id="refreshBtn">🔄 最新に更新</button>
        </div>
        <select id="playlistSelect" onchange="loadVideos(false)">
          <option value="ALL">全ての動画</option>
        </select>
      </div>

      <div class="tab-container">
        <button class="tab-btn active" id="btn-all" onclick="switchType('all')">全て</button>
        <button class="tab-btn" id="btn-normal" onclick="switchType('normal')">通常</button>
        <button class="tab-btn" id="btn-shorts" onclick="switchType('shorts')">Shorts</button>
      </div>

      <div class="form-group">
        <label>🔍 キーワード検索</label>
        <input type="text" id="searchInput" placeholder="バンド名、曲名など" oninput="filterVideos()">
      </div>
    </div>

    <div id="loading">YouTubeのデータを読み込み中...</div>
    <div id="videoList" class="video-grid"></div>
  </div>

  <script>
    // ▼▼▼ パスワード回避防止ガード ▼▼▼
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "../"; 
    }

    // ★★★ ここに生成したGAS（ウェブアプリ）のURLを貼り付けます ★★★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbweLz3FJkyLrvrBLXQhYr2QOyYV8hMWeBloQsKEaWtUjqxZ_n9uKEV9JtEEQw0qShov-g/exec";

    let allVideos = [];
    let currentType = 'all';

    async function callGasApi(action, dataObj) {
      const payload = { action: action, data: dataObj };
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    window.onload = async function() {
      // プレイリストのキャッシュを確認
      const cachedPlaylists = localStorage.getItem("yt_playlists");
      if (cachedPlaylists) {
        populatePlaylistSelect(JSON.parse(cachedPlaylists));
        loadVideos(false); // キャッシュがあれば動画もキャッシュからロード
      } else {
        await fetchAndCachePlaylists();
      }
    };

    async function fetchAndCachePlaylists() {
      try {
        const res = await callGasApi("getPlaylists", {});
        if(res.success) {
          localStorage.setItem("yt_playlists", JSON.stringify(res.playlists));
          populatePlaylistSelect(res.playlists);
          await loadVideos(true); // 初回はAPIから動画を取得
        }
      } catch (e) {
        document.getElementById('loading').textContent = "プレイリストの読み込みに失敗しました";
      }
    }

    function populatePlaylistSelect(playlists) {
      const select = document.getElementById('playlistSelect');
      // 「全ての動画」を残してリセット
      select.innerHTML = '<option value="ALL">全ての動画</option>';
      playlists.forEach(pl => {
        const opt = document.createElement('option');
        opt.value = pl.id;
        opt.textContent = pl.title;
        select.appendChild(opt);
      });
    }

    // forceFetchがtrueなら強制的にAPIから取得、falseならキャッシュ優先
    async function loadVideos(forceFetch) {
      document.getElementById('videoList').innerHTML = '';
      const pid = document.getElementById('playlistSelect').value;
      const cacheKey = "yt_videos_" + pid;

      if (!forceFetch) {
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) {
          allVideos = JSON.parse(cachedData);
          document.getElementById('loading').style.display = 'none';
          filterVideos();
          return; // キャッシュがあればここで終了（一瞬で表示）
        }
      }

      // キャッシュがない、または強制更新の場合はAPI通信
      document.getElementById('loading').textContent = "最新データを取得中... (約20秒)";
      document.getElementById('loading').style.display = 'block';

      try {
        const res = await callGasApi("getPlaylistVideos", { playlistId: pid });
        if(res.success) {
          allVideos = res.videos;
          // 新しいデータをスマホに記憶させる
          localStorage.setItem(cacheKey, JSON.stringify(res.videos));
          filterVideos();
        } else {
          document.getElementById('loading').textContent = "エラー: " + res.error;
        }
      } catch (e) {
        document.getElementById('loading').textContent = "通信エラーが発生しました";
      }
    }

    // 更新ボタンを押した時の処理
    async function forceRefresh() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = "⏳ 更新中...";
      
      // キャッシュを全クリアして再取得
      localStorage.removeItem("yt_playlists");
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("yt_videos_")) localStorage.removeItem(key);
      });

      await fetchAndCachePlaylists();
      
      btn.textContent = "🔄 最新に更新";
      btn.disabled = false;
    }

    function switchType(type) {
      currentType = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + type).classList.add('active');
      filterVideos();
    }

    function filterVideos() {
      document.getElementById('loading').style.display = 'none';
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allVideos.filter(v => {
        const matchKey = v.title.toLowerCase().includes(keyword);
        const matchType = (currentType === 'all') || 
                          (currentType === 'normal' && !v.isShort) || 
                          (currentType === 'shorts' && v.isShort);
        return matchKey && matchType;
      });

      render(filtered);
    }

    function render(videos) {
      const container = document.getElementById('videoList');
      container.innerHTML = '';
      
      if(videos.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">該当する動画がありません</p>';
        return;
      }

      videos.forEach(v => {
        const a = document.createElement('a');
        a.href = v.isShort ? 'https://www.youtube.com/shorts/' + v.videoId : 'https://www.youtube.com/watch?v=' + v.videoId;
        a.target = '_blank';
        a.className = 'video-card';
        
        const dateObj = new Date(v.publishedAt);
        const dateStr = `${dateObj.getFullYear()}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${String(dateObj.getDate()).padStart(2,'0')}`;
        
        let badge = v.isShort ? '<div style="position:absolute; top:4px; right:4px; background:red; color:white; font-size:10px; padding:2px 4px; border-radius:3px;">Shorts</div>' : '';

        a.innerHTML = `
          <div style="position:relative;">
            <img src="${v.thumbnail}" class="video-thumb">
            ${badge}
          </div>
          <div class="video-info">
            <p class="video-title">${v.title}</p>
            <p class="video-date">${dateStr}</p>
          </div>
        `;
        container.appendChild(a);
      });
    }
  </script>
</body>
</html>
