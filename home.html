<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Higo-Pella Portal</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .menu { display: none; margin-top: 20px; }
    .menu-btn { display: block; padding: 15px; margin: 10px 0; background: #e9ecef; color: #333; text-decoration: none; border-radius: 8px; font-weight: bold; }
    .menu-btn:hover { background: #d3d9df; }
    #error-msg { color: red; font-size: 14px; display: none; }
  </style>
</head>
<body>

  <div class="container" id="login-screen">
    <h2>Higo-Pella Portal</h2>
    <p>パスワードを入力してください</p>
    <input type="password" id="password" placeholder="パスワード">
    <button onclick="checkPassword()">ログイン</button>
    <p id="error-msg">パスワードが間違っています</p>
  </div>

  <div class="container menu" id="menu-screen">
    <h2>📝 Portal Menu</h2>
    <!-- ここに各フォルダへのリンクを置きます -->
    <a href="./booking/" class="menu-btn">📅 練習場所 予約システム</a>
    <a href="./searchYT/" class="menu-btn">▶️ YouTube 検索システム</a>
    <a href="./forms/" class="menu-btn">📋 各種申請フォーム</a>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById("password").value;
      // ▼ ここに設定したいパスワードを入力します ▼
      const secret = "higo2026"; 

      if(input === secret) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }
  </script>

</body>
</html>
