<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higopelive!! - Higo-Pella Portal</title>
  <link rel="stylesheet" href="../../src/css/common.css">
  <link rel="stylesheet" href="../../src/css/admin.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-role-key="higopelive" data-required-role="higopelive">

  <!-- 0. 権限確認中 -->
  <div id="admin-checking-section" class="container">
    <div class="card admin-login-card">
      <h2 class="admin-login-title">権限確認中</h2>
      <p class="admin-login-description">権限を確認しています…</p>
    </div>
  </div>

  <!-- 1. 権限なし表示 -->
  <div id="admin-access-denied-section" class="container is-hidden">
    <div class="card admin-login-card">
      <h2 class="admin-login-title">権限がありません</h2>
      <p class="admin-login-description">このページはHigopelive!!担当のみアクセスできます。</p>
      <a href="../../" class="btn btn-primary full-width">ホームへ戻る</a>
    </div>
  </div>

  <!-- 2. Higopelive!! ダッシュボード -->
  <main id="admin-dashboard-section" class="container is-hidden">
    <nav id="role-switcher" class="role-switcher is-hidden" aria-label="権限切替"></nav>

    <nav class="admin-tabs" aria-label="Higopelive!!メニュー">
      <button type="button" class="admin-tab active" data-tab="lives">ライブ管理</button>
      <button type="button" class="admin-tab" data-tab="apps">申請一覧</button>
    </nav>

    <div class="admin-tab-panel" id="tab-lives">

    <!-- ライブ作成 -->
    <section class="card">
      <div class="card-title">ライブを作成</div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="live-new-title">タイトル</label>
        <input type="text" id="live-new-title" class="input-text" placeholder="例: 12月Higopelive!" maxlength="100">
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="live-new-date">開催日</label>
        <input type="date" id="live-new-date" class="input-text">
      </div>
      <div class="admin-form-group">
        <label class="pin-label">
          <input type="checkbox" id="live-new-lighting" checked> 照明表を受け付ける
        </label>
      </div>
      <div class="notice-form-row">
        <span></span>
        <button type="button" id="btn-create-live" class="btn btn-primary">作成</button>
      </div>
    </section>

    <!-- ライブ一覧（フォルダ） -->
    <section class="card">
      <div class="card-title">ライブ一覧</div>
      <div id="higopelive-live-list">読み込み中...</div>
    </section>
    </div>

    <div class="admin-tab-panel is-hidden" id="tab-apps">

    <!-- 申請一覧 -->
    <section class="card">
      <div class="card-title">申請一覧 <span id="higopelive-current-live" class="admin-login-description"></span></div>
      <div class="notice-form-row">
        <span></span>
        <div class="notice-submit-group">
          <button type="button" id="btn-batch-pa" class="btn small-action-button">PA表を一括PDF</button>
          <button type="button" id="btn-batch-light" class="btn small-action-button">照明表を一括PDF</button>
        </div>
      </div>
      <div id="higopelive-app-list">ライブ管理タブからライブを選択してください</div>
    </section>

    <!-- 申請詳細 -->
    <section class="card is-hidden" id="higopelive-detail-card">
      <div class="card-title" id="higopelive-detail-title">申請詳細</div>
      <div class="notice-form-row">
        <span></span>
        <div class="notice-submit-group">
          <button type="button" id="btn-print-pa" class="btn small-action-button">PA表をPDF</button>
          <button type="button" id="btn-print-light" class="btn small-action-button">照明表をPDF</button>
        </div>
      </div>
      <div id="higopelive-detail"></div>
    </section>
    </div>
  </main>

  <script src="../../src/js/ui.js"></script>
  <script src="../../src/js/notice-cache.js"></script>
  <script src="../../src/js/api.js"></script>
  <script src="../../src/js/auth.js"></script>
  <script src="../../src/js/menu.js"></script>
  <script src="../../src/js/tour.js"></script>
  <script src="../../src/js/role-page.js"></script>
</body>
</html>
