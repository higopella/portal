<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>練習場所 予約</title>
  <!-- ファビコン（PCタブ用） -->
  <link rel="icon" href="../src/icon.png" type="image/png">
  <!-- iPhone (Safari) 用アプリアイコン -->
  <link rel="apple-touch-icon" href="../src/icon.png">
  <!-- Android (Chrome) 用アプリ設定 -->
  <link rel="manifest" href="../manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f4f6f9; padding: 15px; margin: 0; color: #333; }
    
    .app-container { max-width: 800px; margin: 0 auto; }
    
    .nav-bar { background-color: #0056b3; color: white; padding: 12px; font-weight: bold; display: flex; justify-content: space-between; border-radius: 8px; margin-bottom: 15px; align-items: center; }
    .nav-link { color: white; text-decoration: none; font-size: 14px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; width: 100%; }
    
    h3 { margin-top: 0; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; color: #0056b3; }
    .form-group { margin-bottom: 15px; width: 100%; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    
    /* はみ出し防止リセット */
    input, select { display: block; width: 100%; max-width: 100%; height: 44px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background-color: #ffffff; }
    input[type="date"], input[type="time"], input[type="number"] { -webkit-appearance: none; appearance: none; }
    
    .preset-container { display: flex; gap: 8px; margin-top: 8px; }
    .btn-preset { flex: 1; padding: 8px; background-color: #e9ecef; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-weight: bold; color: #495057; cursor: pointer; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; color: white; margin-top: 15px; }
    .btn-primary { background-color: #0056b3; }
    .btn-danger { background-color: #dc3545; }
    .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    .page-switch-link { display: inline-block; margin-bottom: 15px; color: #0056b3; text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer; }
    .loading { display: none; text-align: center; font-weight: bold; color: #0056b3; margin-top: 10px; }
    
    .delete-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background-color: #fff0f1; border: 1px solid #fbc4c8; border-radius: 4px; margin-bottom: 8px; }
    .btn-delete-item { padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; flex-shrink: 0; }

    /* ★復元：カレンダーのタブボタン */
    .calendar-tabs { display: flex; gap: 5px; margin-bottom: 15px; align-items: center; }
    .tab-btn { padding: 8px 16px; background-color: #e9ecef; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; color: #495057; }
    .tab-btn.active { background-color: #0056b3; color: white; border-color: #0056b3; }
    .refresh-btn { margin-left: auto; background-color: #6c757d; color: white; border-color: #6c757d; }

    /* ★復元：スマホ横スクロール対応のカレンダー枠 */
    .calendar-container { position: relative; height: 550px; overflow-x: auto; overflow-y: hidden; border: 1px solid #ddd; border-radius: 4px; -webkit-overflow-scrolling: touch; }
    @media (min-width: 768px) { .calendar-container { height: 600px; overflow: hidden; } }
    .calendar-container iframe { position: absolute; top:0; left: 0; width: 100%; min-width: 750px; height: 100%; border: 0; }
    @media (min-width: 768px) { .calendar-container iframe { min-width: 100%; } }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="nav-bar">
      <span>📅 練習場所 予約</span>
      <a href="../" class="nav-link">🏠 ホームへ戻る</a>
    </div>

    <!-- カレンダーセクション -->
    <div class="card">
      <h3>現在の予約状況</h3>
      <div class="calendar-tabs">
          <button type="button" class="tab-btn" id="btn-agenda" onclick="switchMode('agenda')">スケジュール</button>
          <button type="button" class="tab-btn active" id="btn-week" onclick="switchMode('week')">週</button>
          <button type="button" class="tab-btn" id="btn-month" onclick="switchMode('month')">月</button>
          <button type="button" class="tab-btn refresh-btn" onclick="refreshCalendar()">🔄 更新</button>
      </div>
      <div class="calendar-container" id="calendarContainer">
          <!-- ここにJavaScriptでiframeが生成されます -->
      </div>
    </div>

    <!-- 新規予約画面 -->
    <div class="card" id="reservationPage">
      <a class="page-switch-link" onclick="switchPage('delete')">➔ 予約の削除・検索はこちら</a>
      <h3>新規予約</h3>
      <div class="form-group"><label>日付</label><input type="date" id="date" required></div>
      <div class="form-group"><label>開始時刻（7:00 〜 21:00）</label><input type="time" id="startTime" min="07:00" max="21:00" required></div>
      <div class="form-group"><label>バンド名</label><input type="text" id="bandName" placeholder="例: バンドA" required></div>
      
      <div class="form-group">
          <label>練習場所</label>
          <select id="room" required>
              <option value="" disabled selected>-- 選択してください --</option>
              <option value="①">1 : 部室</option>
              <option value="②">2 : 機材庫</option>
              <option value="③">3 : 教室</option>
          </select>
      </div>
      <div class="form-group"><label>代表者</label><input type="text" id="repName" placeholder="例: 山田" required></div>
      
      <div class="form-group">
          <label>譲ります情報</label>
          <select id="transferStatus" required>
              <option value="" disabled selected>-- 選択してください --</option>
              <option value="いつでも譲ります">いつでも譲ります</option>
              <option value="前半譲ります">前半譲ります</option>
              <option value="後半譲ります">後半譲ります</option>
          </select>
      </div>
      
      <div class="form-group">
          <label>時間（分）</label>
          <input type="number" id="duration" min="1" max="120" placeholder="例: 90" required>
          <div class="preset-container">
              <button type="button" class="btn-preset" onclick="setDuration(30)">30分</button>
              <button type="button" class="btn-preset" onclick="setDuration(60)">60分</button>
              <button type="button" class="btn-preset" onclick="setDuration(90)">90分</button>
              <button type="button" class="btn-preset" onclick="setDuration(120)">120分</button>
          </div>
      </div>
      
      <button id="submitBtn" class="btn btn-primary" onclick="submitBooking()">この内容で予約を確定する</button>
      <div id="loadingText" class="loading">書き込み中...</div>
    </div>

    <!-- 削除画面 -->
    <div class="card" id="deletePage" style="display: none;">
      <a class="page-switch-link" onclick="switchPage('reserve')">➔ 新規予約はこちら</a>
      <h3 style="color: #dc3545;">予約の削除・検索</h3>
      <p style="font-size: 12px; color: #dc3545; font-weight: bold;">※ 日付、時刻、バンド名のいずれかを入力</p>
      
      <div class="form-group"><label>日付</label><input type="date" id="deleteDate"></div>
      <div class="form-group"><label>開始時刻</label><input type="time" id="deleteStartTime"></div>
      <div class="form-group"><label>バンド名</label><input type="text" id="deleteBandName" placeholder="例: バンドA"></div>
      
      <button id="searchDeleteBtn" class="btn btn-danger" onclick="searchForDelete()">対象を検索する</button>
      
      <div id="deleteEventListContainer" style="margin-top: 20px; display: none;">
          <label style="color: #dc3545; font-weight: bold; font-size: 14px;">該当する予約</label>
          <div id="deleteEventList" style="margin-top: 10px;"></div>
      </div>
      <div id="deleteLoadingText" class="loading" style="color: #dc3545;">検索中...</div>
    </div>
  </div>

  <script>
    // ▼▼▼ パスワード回避防止ガード ▼▼▼
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "../"; 
    }

    // ★★★ ここに生成したGAS（ウェブアプリ）のURLを貼り付けます ★★★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbweLz3FJkyLrvrBLXQhYr2QOyYV8hMWeBloQsKEaWtUjqxZ_n9uKEV9JtEEQw0qShov-g/exec";

    let currentMode = 'week';

    // 画面読み込み時にカレンダーを描画
    window.onload = function() {
      refreshCalendar();
    };

    // カレンダーの表示形式切り替え
    function switchMode(mode) { 
      currentMode = mode; 
      document.querySelectorAll('.tab-btn:not(.refresh-btn)').forEach(btn => btn.classList.remove('active')); 
      document.getElementById('btn-' + mode).classList.add('active'); 
      refreshCalendar(); 
    }

    // カレンダーのiframeを生成・更新（キャッシュ回避）
    function refreshCalendar() {
      const container = document.getElementById('calendarContainer'); 
      const timestamp = new Date().getTime(); 
      const todayWkst = new Date().getDay() + 1; 
      
      // メインカレンダー（これらが抜けていました！）
      const calMain = encodeURIComponent('pellapella.calendar@gmail.com');
      const colMain = '%23D50000'; 

      // 部屋ごとのカレンダー
      const calBushitsu = encodeURIComponent('a18eeaccc3fb519de5b4b3492df6b26232f7967ab4582a2cd4d314600aa03186@group.calendar.google.com');
      const colBushitsu = '%23039BE5'; 

      const calKizai = encodeURIComponent('aade55a25aef3abb1ab00c832c44b660df1336a113dc29c6fff776f046df3dd3@group.calendar.google.com');
      const colKizai = '%23F6BF26'; 

      const calKyoshitsu = encodeURIComponent('fdb34873e469d812b70c3e1f79978398d9a3c0a793287551c3a77ae84f7ed079@group.calendar.google.com');
      const colKyoshitsu = '%2333B679'; 

      // 4つすべてのカレンダーを結合
      const calSrc = `src=${calMain}&color=${colMain}&src=${calBushitsu}&color=${colBushitsu}&src=${calKizai}&color=${colKizai}&src=${calKyoshitsu}&color=${colKyoshitsu}`;

      // iframeを再生成
      container.innerHTML = '<iframe id="calendarFrame" src="https://calendar.google.com/calendar/embed?' + calSrc + '&ctz=Asia%2FTokyo&mode=' + currentMode + '&wkst=' + todayWkst + '&showTitle=0&showPrint=0&showTabs=0&t=' + timestamp + '" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>';
    }

    function switchPage(page) {
      if (page === 'reserve') {
        document.getElementById('reservationPage').style.display = 'block';
        document.getElementById('deletePage').style.display = 'none';
      } else {
        document.getElementById('reservationPage').style.display = 'none';
        document.getElementById('deletePage').style.display = 'block';
      }
    }

    function setDuration(min) {
      document.getElementById('duration').value = min;
    }

    async function callGasApi(action, dataObj) {
      const payload = { action: action, data: dataObj };
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    async function submitBooking() {
      const data = {
        date: document.getElementById('date').value,
        startTime: document.getElementById('startTime').value,
        bandName: document.getElementById('bandName').value,
        room: document.getElementById('room').value,
        repName: document.getElementById('repName').value,
        transferStatus: document.getElementById('transferStatus').value,
        duration: document.getElementById('duration').value
      };

      if (!data.date || !data.startTime || !data.bandName || !data.room || !data.repName || !data.duration) {
        alert("入力が不足しています。"); return;
      }

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('loadingText').style.display = 'block';

      try {
        const res = await callGasApi("addEventToCalendar", data);
        if (res.success) {
          alert('予約が完了しました！');
          // フォームをリセットしてカレンダーを更新
          ['date', 'startTime', 'bandName', 'room', 'repName', 'transferStatus', 'duration'].forEach(id => document.getElementById(id).value = '');
          refreshCalendar();
        } else {
          alert('エラー: ' + res.error);
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      }

      document.getElementById('submitBtn').disabled = false;
      document.getElementById('loadingText').style.display = 'none';
    }

    async function searchForDelete() {
      const data = {
        date: document.getElementById('deleteDate').value,
        startTime: document.getElementById('deleteStartTime').value,
        bandName: document.getElementById('deleteBandName').value
      };

      if (!data.date && !data.startTime && !data.bandName) {
        alert('検索条件を1つ以上入力してください。'); return;
      }

      document.getElementById('searchDeleteBtn').disabled = true;
      document.getElementById('deleteLoadingText').style.display = 'block';
      document.getElementById('deleteEventListContainer').style.display = 'none';

      try {
        const res = await callGasApi("findEvents", data);
        if (res.success) {
          const listDiv = document.getElementById('deleteEventList');
          listDiv.innerHTML = '';
          res.events.forEach(ev => {
            const item = document.createElement('div'); item.className = 'delete-item';
            const text = document.createElement('span');
            text.innerHTML = `<strong>${ev.startStr}</strong><br>${ev.title} [${ev.duration}分]`;
            text.style.fontSize = "13px";
            
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete-item'; delBtn.textContent = '削除';
            delBtn.onclick = () => executeDelete(ev.id, ev.title);
            
            item.appendChild(text); item.appendChild(delBtn);
            listDiv.appendChild(item);
          });
          document.getElementById('deleteEventListContainer').style.display = 'block';
        } else {
          alert(res.error);
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      }

      document.getElementById('searchDeleteBtn').disabled = false;
      document.getElementById('deleteLoadingText').style.display = 'none';
    }

    async function executeDelete(eventId, title) {
      if (!confirm(`本当に削除しますか？\n\n${title}`)) return;

      document.getElementById('deleteLoadingText').textContent = '削除中...';
      document.getElementById('deleteLoadingText').style.display = 'block';

      try {
        const res = await callGasApi("deleteEventById", { eventId: eventId });
        if (res.success) {
          alert('削除しました。');
          searchForDelete(); 
          refreshCalendar(); // 削除後もカレンダーを更新
        } else {
          alert('エラー: ' + res.error);
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
      }
      document.getElementById('deleteLoadingText').style.display = 'none';
    }
  </script>
</body>
</html>
