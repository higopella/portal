<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube | Higo-Pella</title>
  <style>
    * { box-sizing: border-box; }
    :root { --primary: #4fc3f7; --bg: #f7fbff; --card: #fff; --border: #e1e8ed; --text: #333; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    
    .header { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 16px; font-weight: 600; }
    .nav-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    
    .content { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    
    .row { display: flex; gap: 5px; margin-bottom: 15px; }
    select, input, button { height: 40px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; background: #fff; outline: none; }
    select { flex: 2; padding: 0 10px; }
    .btn-update { flex: 1; background: #f0f4f8; cursor: pointer; }
    
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab-btn { flex: 1; background: var(--card); cursor: pointer; border: 1px solid var(--border); }
    .tab-btn.active { background: #333; color: #fff; border-color: #333; }
    input[type="text"] { width: 100%; padding: 0 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .v-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
    .v-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
    .v-info { padding: 10px; }
    .v-title { font-size: 12px; font-weight: 600; margin: 0 0 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .v-date { font-size: 10px; color: #777; margin: 0; }
    .badge { position: absolute; top: 5px; right: 5px; background: #000; color: #fff; font-size: 9px; padding: 2px 4px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">YouTube</div>
    <a href="../" class="nav-link">Home</a>
  </div>

  <div class="content">
    <div class="card">
      <div class="row">
        <select id="pl" onchange="load(false)"><option value="ALL">ALL</option></select>
        <button class="btn-update" id="refBtn" onclick="force()">更新</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="btn-all" onclick="mode('all')">全て</button>
        <button class="tab-btn" id="btn-normal" onclick="mode('normal')">通常</button>
        <button class="tab-btn" id="btn-shorts" onclick="mode('shorts')">Shorts</button>
      </div>
      <input type="text" id="search" placeholder="Search..." oninput="filter()">
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") window.location.href = "../";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwF_t2MZTpa2p0Jb8QF_upAmLfdBDLP9_8ciRWyqSpFRga9NU1INj-M9b4Qp8YMsxMJbA/exec";
    let vids = [], cur = 'all';

    window.onload = async () => {
      const c = localStorage.getItem("yt_pl");
      if (c) { setupPl(JSON.parse(c)); load(false); } else force();
    };

    function setupPl(pls) {
      const s = document.getElementById('pl'); s.innerHTML = '<option value="ALL">ALL</option>';
      pls.forEach(p => s.innerHTML += `<option value="${p.id}">${p.title}</option>`);
    }

    async function force() {
      document.getElementById('refBtn').disabled = true;
      localStorage.removeItem("yt_pl");
      Object.keys(localStorage).forEach(k => { if(k.startsWith("yt_v_")) localStorage.removeItem(k); });
      try {
        const res = await fetch(GAS_API_URL, { method:"POST", body: JSON.stringify({action:"getPlaylists"}) });
        const json = await res.json();
        if(json.success) { localStorage.setItem("yt_pl", JSON.stringify(json.playlists)); setupPl(json.playlists); load(true); }
      } catch(e){}
      document.getElementById('refBtn').disabled = false;
    }

    async function load(f) {
      const pid = document.getElementById('pl').value;
      const key = "yt_v_" + pid;
      if(!f && localStorage.getItem(key)) { vids = JSON.parse(localStorage.getItem(key)); filter(); return; }
      try {
        const res = await fetch(GAS_API_URL, { method:"POST", body: JSON.stringify({action:"getPlaylistVideos", data:{playlistId: pid}}) });
        const json = await res.json();
        if(json.success) { vids = json.videos; localStorage.setItem(key, JSON.stringify(vids)); filter(); }
      } catch(e){}
    }

    function mode(m) {
      cur = m; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-'+m).classList.add('active'); filter();
    }

    function filter() {
      const k = document.getElementById('search').value.toLowerCase();
      const f = vids.filter(v => v.title.toLowerCase().includes(k) && (cur==='all' || (cur==='normal' && !v.isShort) || (cur==='shorts' && v.isShort)));
      const g = document.getElementById('grid'); g.innerHTML = '';
      f.forEach(v => {
        const d = new Date(v.publishedAt);
        g.innerHTML += `<a href="https://youtube.com/watch?v=${v.videoId}" target="_blank" class="v-card">
          <div style="position:relative;"><img src="${v.thumbnail}" class="v-thumb">${v.isShort?'<span class="badge">SHORTS</span>':''}</div>
          <div class="v-info"><p class="v-title">${v.title}</p><p class="v-date">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}</p></div></a>`;
      });
    }
  </script>
</body>
</html>
