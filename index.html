<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="src/icon.png">
  <link rel="apple-touch-icon" href="src/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/home.css">
  <script id="google-identity-script" src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-section" class="container is-hidden">
    <div class="card login-container">
      <div class="login-brand">
        <img src="src/icon.png" alt="Higo-Pella Logo" class="login-logo">
        <div class="login-app-name">Higo-Pella</div>
      </div>
      <div id="google-login-panel">
        <p class="login-description">Googleアカウントでログインしてください</p>
        <div id="google-login-button" class="google-login-button"></div>
        <p id="login-status" class="login-status" aria-live="polite"></p>
        <div class="login-links">
          <a class="signup-link" href="signup/">新規登録</a>
          <span class="link-divider">|</span>
          <a class="calendar-link" href="calendar/">カレンダー</a>
        </div>
        <div class="login-privacy">
          <a class="privacy-link" href="privacy/">プライバシーポリシー</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ログイン後メイン画面 -->
  <main id="main-section" class="container is-hidden">
    <div class="home-content-grid">
      <section class="card home-notices">
        <div class="card-header">
          <div class="header-left">
            <span class="card-title">お知らせ</span>
            <!-- 次回部会をインライン統合 -->
            <div class="meeting-tag">部会: <span id="next-meeting-text">計算中...</span></div>
          </div>
        </div>
        <div id="notice-container" class="notice-list">
          <div class="notice-message-loading">読み込み中...</div>
        </div>
      </section>

      <section class="card home-calendar" data-schedule-calendar data-schedule-template="src/calendar.html">
        <div class="card-header">
          <span class="card-title">直近の予約</span>
        </div>
        <div id="home-schedule"></div>
      </section>
    </div>

  </main>

  <script src="src/js/ui.js"></script>
  <script src="src/js/calendar-cache.js"></script>
  <script src="src/js/notice-cache.js"></script>
  <script src="src/js/calendar.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/auth.js"></script>
  <script src="src/js/menu.js"></script>
  <script src="src/js/tour.js"></script>
  <script src="src/js/home.js"></script>
</body>
</html>
