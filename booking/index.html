<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習予約 - Higo-Pella Portal</title>
  <link rel="icon" type="image/png" href="../src/icon.png">
  <link rel="apple-touch-icon" href="../src/icon.png">
  <link rel="stylesheet" href="../src/css/common.css">
  <link rel="stylesheet" href="../src/css/calendar.css">
  <link rel="stylesheet" href="../src/css/booking.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <main class="container booking-layout">
    <section class="card schedule-card" data-schedule-calendar data-schedule-template="../src/calendar.html">
      <div id="booking-schedule"></div>
    </section>

    <div class="card booking-form-card">
      <div class="tab-nav">
        <button type="button" class="tab-btn active" id="tab-btn-create">新規予約</button>
        <button type="button" class="tab-btn" id="tab-btn-search">予約削除</button>
      </div>

      <!-- 新規予約 -->
      <section id="panel-create" aria-labelledby="tab-btn-create">
        <form id="form-booking">
          <div class="form-group">
            <label class="form-label" for="book-date">練習日</label>
            <input type="date" id="book-date" class="form-control" required>
          </div>

          <div class="form-group">
            <div id="available-time-slots" class="available-time-slots" hidden></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-start-time">開始時間</label>
            <input type="time" id="book-start-time" class="form-control" step="60" required>
          </div>

          <div class="booking-time-grid">
            <div class="form-group">
              <label class="form-label" for="book-duration">利用分数</label>
              <input type="number" id="book-duration" class="form-control" min="1" max="120" step="1" inputmode="numeric" required>
              <div class="duration-presets" aria-label="利用分数の候補">
                <button type="button" class="duration-preset" data-duration="30">30分</button>
                <button type="button" class="duration-preset" data-duration="60">60分</button>
                <button type="button" class="duration-preset" data-duration="90">90分</button>
                <button type="button" class="duration-preset" data-duration="120">120分</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="book-room">練習場所</label>
            <select id="book-room" class="form-control" required>
              <option value="" selected disabled>選択してください</option>
              <option value="①">部室①</option>
              <!-- 機材庫は一般利用停止中のため予約不可。復活する場合は下記コメントを外す -->
              <!-- <option value="②">機材庫②</option> -->
              <option value="③">教室③</option>
            </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="end-time-preview">終了時間</label>
            <div id="end-time-preview" class="end-time-preview">開始時間と利用分数を入力してください</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-band-name">バンド名</label>
            <input type="text" id="book-band-name" class="form-control" placeholder="例: バンドA" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-rep-name">代表者名</label>
            <input type="text" id="book-rep-name" class="form-control" placeholder="例: 肥後" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-transfer">譲ります情報</label>
            <select id="book-transfer" class="form-control" required>
              <option value="" selected disabled>選択してください</option>
              <option value="いつでも">いつでも譲ります</option>
              <option value="前半">前半譲ります</option>
              <option value="後半">後半譲ります</option>
            </select>
          </div>

          <!-- スマホ対応のフルワイド予約ボタン -->
          <button type="submit" id="btn-submit-booking" class="btn btn-primary full-width-booking-button">予約</button>
        </form>
      </section>

      <!-- 検索・削除 -->
      <section id="panel-search" class="search-panel-hidden">
        <form id="form-search" class="search-form">
          <div class="form-group">
            <label class="form-label" for="search-date">練習日</label>
            <input type="date" id="search-date" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label" for="search-band-name">バンド名</label>
            <input type="text" id="search-band-name" class="form-control" placeholder="バンド名で絞り込み">
          </div>
          <button type="submit" id="btn-search-booking" class="btn btn-primary full-width-search-button">検索</button>
        </form>

        <div id="search-results"></div>
      </section>
    </div>

  </main>

  <script src="../src/js/ui.js"></script>
  <script src="../src/js/calendar-cache.js"></script>
  <script src="../src/js/calendar.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/auth.js"></script>
  <script src="../src/js/menu.js"></script>
  <script src="../src/js/tour.js"></script>
  <script src="../src/js/booking.js"></script>
</body>
</html>
